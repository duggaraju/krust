[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[features]
default = ["mm", "process", "fs", "drivers", "modules", "shell"]
mm = []
process = ["mm"]

# Device feature families. Keep `drivers` as a compatibility umbrella while we
# migrate call sites from coarse `cfg(feature = "drivers")` checks.
device = []
device-null = ["device"]
device-serial = ["device"]
device-video = ["device"]
device-tty = ["device", "device-serial", "device-video"]
drivers = ["device-null", "device-serial", "device-video", "device-tty"]

# Filesystem feature families. Keep `fs` as the compatibility umbrella.
fs-core = []
fs-ramfs = ["fs-core"]
fs-initrd = ["fs-core"]
fs-fat32 = ["fs-core", "device"]
fs-dev = ["fs-core", "device"]
fs-proc = ["fs-core", "process"]
fs = ["fs-core", "fs-ramfs", "fs-initrd", "fs-fat32", "fs-dev", "fs-proc"]

modules = ["fs"]
shell = []

[dependencies]
bootloader_api = "0.11.15"
bootloader-x86_64-common = "0.11.15"
bootloader-boot-config = "0.11.15"
log = "0.4.29"
uart_16550 = "0.6.0"
pc-keyboard = "0.9.0"
x86_64 = "0.15.4"
vga = "0.2.9"
spin = "0.12"
linked_list_allocator = "0.10"
bitflags = "2"
