[package]
name = "krust"
version = "0.1.0"
edition = "2024"

[build-dependencies]
bootloader = "0.11.15"
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none", features = ["shell"] }

[dependencies]
bootloader = "0.11.15"
nix = { version = "0.31.3", features = ["term"] }
# used for UEFI booting in QEMU
ovmf-prebuilt = "0.2.9"
fatfs = "0.3.6"
clap = { version = "4.6.1", features = ["derive"] }

[[test]]
name = "cloexec"
path = "scripts/tests/cloexec.rs"

[[test]]
name = "mmap"
path = "scripts/tests/mmap-range.rs"

[[test]]
name = "pci"
path = "kernel/src/drivers/bus/pci/enumeration.rs"

[workspace]
resolver = "3"
members = [
    "kernel",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
