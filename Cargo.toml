[package]
name = "krust"
version = "0.1.0"
edition = "2024"

[build-dependencies]
bootloader = "0.11.15"
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none", features = ["shell"] }

[dependencies]
bootloader = "0.11.15"
nix = { version = "0.31.3", features = ["term"] }
# used for UEFI booting in QEMU
ovmf-prebuilt = "0.2.9"
fatfs = "0.3.6"
clap = { version = "4.6.1", features = ["derive"] }

[dev-dependencies]
guest = { package = "krust-guest", path = "tests/guest", artifact = "bin", target = "x86_64-unknown-none" }
mock = { package = "krust-mock", path = "tests/mock", artifact = "bin" }
spin = "0.12"
log = "0.4.29"
regex = "1"
nix = { version = "0.31.3", features = ["signal", "process"] }

[[test]]
name = "pci"
path = "kernel/src/drivers/bus/pci/enumeration.rs"

[workspace]
resolver = "3"
members = [
    "kernel",
    "tests/guest",
    "tests/mock",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
