name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
            - rust-toolchain.toml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml
            - rust-toolchain.toml

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Install repository Rust toolchain
              # No channel override: install the pin, components, and targets from rust-toolchain.toml.
              run: rustup toolchain install

            - name: Allow agent to read ~/.cargo
              run: |
                  echo "$HOME/.cargo" >> "$GITHUB_PATH"
                  echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
